name: Build iOS

on:
  workflow_dispatch:
  push:
    branches:
      - ios

permissions:
  contents: read

env:
  RUST_VERSION: 1.99.0

jobs:
  build:
    name: iPhone (arm64)
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Reject derived GML
        shell: bash
        run: |
          if grep -R -n -E 'global\.mods_available|file_exists\("mods/|text_op5|draw_text_color\(160|var y0,h,step|mouse_x>=80 && mouse_x<=240' --include='*.rs' src/OpenGMK/gm8emulator/src; then
            echo "::error::Derived GML found"
            exit 1
          fi

      - name: Install Rust
        shell: bash
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --target aarch64-apple-ios

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/OpenGMK/target
          key: ios-${{ env.RUST_VERSION }}-${{ hashFiles('src/OpenGMK/Cargo.lock') }}
          restore-keys: ios-${{ env.RUST_VERSION }}-

      - name: Build .ipa
        shell: bash
        run: RUST_TOOLCHAIN="$RUST_VERSION" bash ios/build-ios.sh

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: reloaded-ios
          if-no-files-found: error
          retention-days: 14
          path: ios/build/Reloaded.ipa
